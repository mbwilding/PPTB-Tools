name: Publish Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  detect-tools:
    name: Detect tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: List tools
        id: list
        run: |
          TOOLS=$(find tools -mindepth 1 -maxdepth 1 -type d \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.tool }}
    needs: detect-tools
    if: ${{ needs.detect-tools.outputs.tools != '[]' && needs.detect-tools.outputs.tools != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ${{ fromJson(needs.detect-tools.outputs.tools) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check if version is new
        id: version-check
        working-directory: ${{ matrix.tool }}
        run: |
          LOCAL=$(jq -r '.version' package.json)
          PKG=$(jq -r '.name' package.json)
          REMOTE=$(npm view "$PKG" version 2>/dev/null || echo "none")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already published, skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Local version $LOCAL differs from remote $REMOTE, will publish."
          fi

      - uses: actions/setup-node@v6.4.0
        if: steps.version-check.outputs.publish == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.version-check.outputs.publish == 'true'
        run: npm ci
        working-directory: ${{ matrix.tool }}

      - name: Validate package manifest
        if: steps.version-check.outputs.publish == 'true'
        run: npm run validate -- --skip-url-checks
        working-directory: ${{ matrix.tool }}

      - name: Test
        if: steps.version-check.outputs.publish == 'true'
        run: npm test
        working-directory: ${{ matrix.tool }}

      - name: Build
        if: steps.version-check.outputs.publish == 'true'
        run: npm run build
        working-directory: ${{ matrix.tool }}

      - name: Finalize package
        if: steps.version-check.outputs.publish == 'true'
        run: npm run finalize-package
        working-directory: ${{ matrix.tool }}

      - name: Publish to npm
        if: steps.version-check.outputs.publish == 'true'
        run: npm publish --access public
        working-directory: ${{ matrix.tool }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
