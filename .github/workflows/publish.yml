name: Publish Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/*/package.json"

jobs:
  detect-changes:
    name: Detect changed tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.changed.outputs.tools }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Find tools with changed package.json
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^tools/[^/]*/package\.json$' \
            | sed 's|/package\.json||' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tools=$CHANGED" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.tool }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.tools != '[]' && needs.detect-changes.outputs.tools != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ${{ fromJson(needs.detect-changes.outputs.tools) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.tool }}

      - name: Validate package manifest
        run: npm run validate -- --skip-url-checks
        working-directory: ${{ matrix.tool }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.tool }}

      - name: Finalize package
        run: npm run finalize-package
        working-directory: ${{ matrix.tool }}

      - name: Publish to npm
        run: npm publish --access public
        working-directory: ${{ matrix.tool }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
