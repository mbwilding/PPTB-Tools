name: Publish Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  detect-tools:
    name: Detect tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: List tools
        id: list
        run: |
          TOOLS=$(find tools -mindepth 1 -maxdepth 1 -type d \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.tool }}
    needs: detect-tools
    if: ${{ needs.detect-tools.outputs.tools != '[]' && needs.detect-tools.outputs.tools != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ${{ fromJson(needs.detect-tools.outputs.tools) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check if version is new
        id: version-check
        working-directory: ${{ matrix.tool }}
        run: |
          LOCAL=$(jq -r '.version' package.json)
          PKG=$(jq -r '.name' package.json)
          TOOL_ID=$(jq -r '.configurations.pptbToolId // ""' package.json)
          REMOTE=$(npm view "$PKG" version 2>/dev/null || echo "none")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "tool_id=$TOOL_ID" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publish required"
          fi

      - uses: actions/setup-node@v6.4.0
        if: steps.version-check.outputs.publish == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.version-check.outputs.publish == 'true'
        run: npm ci
        working-directory: ${{ matrix.tool }}

      - name: Validate package manifest
        if: steps.version-check.outputs.publish == 'true'
        run: npm run validate -- --skip-url-checks
        working-directory: ${{ matrix.tool }}

      - name: Test
        if: steps.version-check.outputs.publish == 'true'
        run: npm test
        working-directory: ${{ matrix.tool }}

      - name: Build
        if: steps.version-check.outputs.publish == 'true'
        run: npm run build
        working-directory: ${{ matrix.tool }}

      - name: Finalize package
        if: steps.version-check.outputs.publish == 'true'
        run: npm run finalize-package
        working-directory: ${{ matrix.tool }}

      - name: Publish to npm
        if: steps.version-check.outputs.publish == 'true'
        run: npm publish --access public
        working-directory: ${{ matrix.tool }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm to reflect published version
        if: steps.version-check.outputs.publish == 'true'
        env:
          SLEEP: 3
        run: |
          PKG="${{ steps.version-check.outputs.pkg }}"
          VERSION="${{ steps.version-check.outputs.local }}"
          echo "Waiting for $PKG@$VERSION to be available on npm..."
          for i in $(seq 1 24); do
            PUBLISHED=$(npm view "$PKG@$VERSION" version 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "Version $VERSION is now available on npm"
              exit 0
            fi
            echo "Attempt $i: not yet available, retrying in ${SLEEP}s..."
            sleep $SLEEP
          done
          echo "Timed out waiting for $PKG@$VERSION to appear on npm"
          exit 1

      - name: Notify PPTB
        if: steps.version-check.outputs.publish == 'true' && steps.version-check.outputs.tool_id != ''
        run: |
          RESPONSE=$(curl -s -X POST https://www.powerplatformtoolbox.com/api/update-tool \
            -H "Content-Type: application/json" \
            -d "{\"toolUpdateId\": \"${{ steps.version-check.outputs.tool_id }}\", \"packageName\": \"${{ steps.version-check.outputs.pkg }}\"}")
          echo "Response: $(echo "$RESPONSE" | jq -r '.message')"
          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            exit 1
          fi
